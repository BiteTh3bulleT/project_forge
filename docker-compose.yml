name: forge

services:
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    image: forge/core:local
    environment:
      FORGE_CORE_PORT: "${FORGE_CORE_PORT:-18492}"
      FORGE_CORE_BIND_HOST: "${FORGE_CORE_BIND_HOST:-0.0.0.0}"
      FORGE_DATA_DIR: "${FORGE_DATA_DIR:-/data}"
      FORGE_MODEL_HOME: "${FORGE_MODEL_HOME:-/models}"
      FORGE_WORKSPACE_DIR: "${FORGE_WORKSPACE_DIR:-/workspace}"
      FORGE_STORE_BACKEND: "${FORGE_STORE_BACKEND:-sqlite}"
      FORGE_ENABLE_MODEL_RUNTIME: "${FORGE_ENABLE_MODEL_RUNTIME:-true}"
      FORGE_ENABLE_OPENAI_COMPAT_API: "${FORGE_ENABLE_OPENAI_COMPAT_API:-false}"
      FORGE_MODEL_OPENAI_COMPAT_ENDPOINT: "${FORGE_MODEL_OPENAI_COMPAT_ENDPOINT:-}"
      FORGE_MODEL_DEFAULT_BACKEND: "${FORGE_MODEL_DEFAULT_BACKEND:-}"
      FORGE_MODEL_DEFAULT_ID: "${FORGE_MODEL_DEFAULT_ID:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      FORGE_EMBEDDING_PROVIDER: "${FORGE_EMBEDDING_PROVIDER:-}"
      FORGE_EMBEDDING_MODEL: "${FORGE_EMBEDDING_MODEL:-}"
      FORGE_EMBEDDING_DIMS: "${FORGE_EMBEDDING_DIMS:-128}"
      FORGE_EMBEDDING_TEI_ENDPOINT: "${FORGE_EMBEDDING_TEI_ENDPOINT:-}"
      FORGE_POSTGRES_DSN: "${FORGE_POSTGRES_DSN:-postgres://forge:forge_dev_password@postgres:5432/forge?sslmode=disable}"
      FORGE_REDIS_ADDR: "${FORGE_REDIS_ADDR:-redis:6379}"
      FORGE_REDIS_ENABLED: "${FORGE_REDIS_ENABLED:-false}"
      FORGE_REDIS_KEY_PREFIX: "${FORGE_REDIS_KEY_PREFIX:-forge}"
      FORGE_REDIS_TIMEOUT_MS: "${FORGE_REDIS_TIMEOUT_MS:-1000}"
      FORGE_QDRANT_URL: "${FORGE_QDRANT_URL:-http://qdrant:6333}"
      FORGE_QDRANT_SHADOW_INDEX_ENABLED: "${FORGE_QDRANT_SHADOW_INDEX_ENABLED:-false}"
      FORGE_QDRANT_COLLECTION: "${FORGE_QDRANT_COLLECTION:-forge_shadow_embeddings}"
      FORGE_QDRANT_VECTOR_SIZE: "${FORGE_QDRANT_VECTOR_SIZE:-}"
      FORGE_QDRANT_TIMEOUT_MS: "${FORGE_QDRANT_TIMEOUT_MS:-3000}"
      FORGE_K_SHADOW_MODE_ENABLED: "${FORGE_K_SHADOW_MODE_ENABLED:-false}"
      FORGE_K_SHADOW_CHAT_METADATA_ENABLED: "${FORGE_K_SHADOW_CHAT_METADATA_ENABLED:-false}"
      FORGE_K_SHADOW_RETRIEVAL_METADATA_ENABLED: "${FORGE_K_SHADOW_RETRIEVAL_METADATA_ENABLED:-false}"
      FORGE_K_SHADOW_ADVISORY_ENABLED: "${FORGE_K_SHADOW_ADVISORY_ENABLED:-false}"
      FORGE_SHADOW_DIAGNOSTIC_PERSISTENCE_ENABLED: "${FORGE_SHADOW_DIAGNOSTIC_PERSISTENCE_ENABLED:-false}"
      FORGE_SHADOW_DIAGNOSTIC_RETENTION_DAYS: "${FORGE_SHADOW_DIAGNOSTIC_RETENTION_DAYS:-30}"
      FORGE_SHADOW_DIAGNOSTIC_MAX_PAYLOAD_BYTES: "${FORGE_SHADOW_DIAGNOSTIC_MAX_PAYLOAD_BYTES:-65536}"
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:${FORGE_CORE_PORT:-18492}:${FORGE_CORE_PORT:-18492}"
    volumes:
      - forge-data:/data
      - forge-models:/models
      - forge-workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${FORGE_CORE_PORT:-18492}/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  desktop-web:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
      args:
        VITE_FORGE_API_URL: "http://127.0.0.1:${FORGE_CORE_PORT:-18492}"
    image: forge/desktop-web:local
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:${FORGE_DESKTOP_PORT:-1420}:80"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${FORGE_POSTGRES_DB:-forge}"
      POSTGRES_USER: "${FORGE_POSTGRES_USER:-forge}"
      POSTGRES_PASSWORD: "${FORGE_POSTGRES_PASSWORD:-forge_dev_password}"
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:${FORGE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - forge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORGE_POSTGRES_USER:-forge} -d ${FORGE_POSTGRES_DB:-forge}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:${FORGE_REDIS_PORT:-6379}:6379"
    volumes:
      - forge-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:${FORGE_QDRANT_HTTP_PORT:-6333}:6333"
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:${FORGE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - forge-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:11434:11434"
    volumes:
      - forge-ollama:/root/.ollama
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    profiles: ["tei"]
    ports:
      - "${FORGE_DOCKER_BIND_HOST:-127.0.0.1}:8082:80"
    volumes:
      - forge-tei:/data
    restart: unless-stopped

volumes:
  forge-data:
  forge-models:
  forge-workspace:
  forge-postgres:
  forge-redis:
  forge-qdrant:
  forge-ollama:
  forge-tei:
