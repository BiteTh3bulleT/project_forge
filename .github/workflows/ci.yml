name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  core-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install system desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace deps
        run: npm ci

      - name: Go tests
        run: npm test

      - name: Go vet
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Desktop build
        run: npm run build:desktop

      - name: Smoke
        run: npm run smoke
