name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  core-and-desktop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.12.6
        ports:
          - 6333:6333
          - 6334:6334
    env:
      FORGE_POSTGRES_TEST_DSN: postgres://forge:forge_dev_password@127.0.0.1:5432/forge?sslmode=disable
      FORGE_QDRANT_TEST_URL: http://127.0.0.1:6333
      FORGE_REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace deps
        run: npm ci

      - name: Wait for Qdrant
        run: |
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/6333) >/dev/null 2>&1; do sleep 2; done'

      - name: Rust FORGE-K validator tests
        run: npm run test:rust:forgek

      - name: Rust FORGE-K fixture validation
        run: npm run validate:forgek-fixtures

      - name: Go/Rust FORGE-K parity
        run: npm run test:forgek:parity

      - name: Integration test environment visibility
        run: npm run test:integration:env:required

      - name: Go tests
        run: npm test

      - name: Go race tests (core API)
        run: cd services/core && go test -race ./internal/api

      - name: Go vet
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Repo hygiene tests
        run: npm run test:repo-hygiene

      - name: Repo hygiene validation
        run: npm run validate:repo-hygiene

      - name: OS integration readiness tests
        run: npm run test:os-integration

      - name: OS integration readiness
        run: npm run validate:os-integration

      - name: JS/TS validation
        run: npm run validate:js

      - name: Desktop build
        run: npm run build:desktop

      - name: Smoke
        run: npm run smoke
